# Configs — gemeinsames Link-Manifest
#
# Wird von install/install.sh UND install/install.ps1 gelesen.
# Kommentare (#) und Leerzeilen werden ignoriert.
#
# Zwei Zeilentypen, unterschieden am ersten Feld:
#
#   component  <name>  <cmd|->  <beschreibung ...>
#   <platform> <component> <kind> <source> <target>
#
# --- component-Zeilen (Registry) ---
#   name        : Komponentenname, wie in --only/--skip und im Auswahlmenue
#   cmd         : Programm, das diese Komponente konfiguriert ("-" = keines).
#                 Fehlt es im PATH, weist der Installer darauf hin — die
#                 Verknuepfung wird trotzdem angelegt. Configs verlinkt
#                 Konfiguration, es installiert keine Programme.
#   beschreibung: Freitext bis Zeilenende
#
# --- Verknuepfungszeilen ---
#   platform  : unix | windows | all
#   component : Name aus der Registry oben
#   kind      : link (Datei) | dir (Verzeichnis)
#   source    : Pfad relativ zur Repo-Wurzel
#   target    : Zielpfad; Tokens expandiert der jeweilige Installer
#
# Tokens unix    : $HOME, $XDG_CONFIG  (= ${XDG_CONFIG_HOME:-$HOME/.config})
# Tokens windows : $HOME (USERPROFILE), $APPDATA, $LOCALAPPDATA, $PS5, $PS7
#                  $PS5/$PS7 = Dokumente\WindowsPowerShell bzw. Dokumente\PowerShell
#                  (koennen nach OneDrive umgeleitet sein — $LOCALAPPDATA nie)
#
# Pfade duerfen keine Leerzeichen enthalten (Aufteilung an Whitespace).

# =========================================================================
# Komponenten
# =========================================================================

component  zsh       zsh       my-zsh als Submodul (shells/zsh) plus ~/.zshrc
component  bash      bash      .bashrc und .bash_aliases
component  pwsh      pwsh      PowerShell-Profil und Module fuer PS5 und PS7
component  starship  starship  Prompt-Konfiguration, von zsh UND pwsh geteilt
component  wezterm   wezterm   Entry-Loader nach ~/.config/wezterm/wezterm.lua
component  kitty     kitty     kitty.conf
component  tmux      tmux      tmux.conf
component  lazygit   lazygit   lazygit config.yml
component  glow      glow      glow glow.yml

# =========================================================================
# Verknuepfungen
# =========================================================================

# --- Shells ---------------------------------------------------------------
unix     zsh       link  shells/zsh/.zshrc                              $HOME/.zshrc
unix     bash      link  shells/bash/.bashrc                            $HOME/.bashrc
unix     bash      link  shells/bash/.bash_aliases                      $HOME/.bash_aliases

# Primaeres Modul-Ziel: LOKAL, nie OneDrive. Sind die Dokumente nach OneDrive
# umgeleitet, laedt Import-Module sonst bei JEDEM Start durch den Sync-Layer.
# Abschnitt 0 des Profils haengt genau diesen Pfad vorne in $PSModulePath.
windows  pwsh      dir   shells/pwsh/Modules/MyCliHelpers               $LOCALAPPDATA/PowerShell/Modules/MyCliHelpers

windows  pwsh      link  shells/pwsh/Microsoft.PowerShell_profile.ps1   $PS5/Microsoft.PowerShell_profile.ps1
windows  pwsh      dir   shells/pwsh/Modules/MyCliHelpers               $PS5/Modules/MyCliHelpers
windows  pwsh      link  shells/pwsh/Modules/Update-WindowsApps.psm1    $PS5/Modules/Update-WindowsApps.psm1
windows  pwsh      link  shells/pwsh/Microsoft.PowerShell_profile.ps1   $PS7/Microsoft.PowerShell_profile.ps1
windows  pwsh      dir   shells/pwsh/Modules/MyCliHelpers               $PS7/Modules/MyCliHelpers
windows  pwsh      link  shells/pwsh/Modules/Update-WindowsApps.psm1    $PS7/Modules/Update-WindowsApps.psm1

# --- Prompt (von zsh UND pwsh geteilt) ------------------------------------
unix     starship  link  prompt/starship.toml                           $XDG_CONFIG/starship.toml
windows  starship  link  prompt/starship.toml                           $HOME/.config/starship.toml

# --- Terminals ------------------------------------------------------------
# wezterm laedt ueber einen kleinen Entry-Loader, der die Repo-Config findet.
unix     wezterm   link  install/wezterm-entry.lua                      $XDG_CONFIG/wezterm/wezterm.lua
windows  wezterm   link  install/wezterm-entry.lua                      $HOME/.config/wezterm/wezterm.lua

unix     kitty     link  terminals/kitty/kitty.conf                     $XDG_CONFIG/kitty/kitty.conf
unix     tmux      link  terminals/tmux/tmux.conf                       $HOME/.tmux.conf

# --- CLI-Tools ------------------------------------------------------------
unix     lazygit   link  cli/lazygit/config.yml                         $XDG_CONFIG/lazygit/config.yml
unix     glow      link  cli/glow/glow.yml                              $XDG_CONFIG/glow/glow.yml
windows  lazygit   link  cli/lazygit/config.yml                         $APPDATA/lazygit/config.yml
windows  glow      link  cli/glow/glow.yml                              $APPDATA/glow/glow.yml
