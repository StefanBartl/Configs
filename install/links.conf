# Configs — gemeinsames Link-Manifest
#
# Wird von install/install.sh UND install/install.ps1 gelesen. Eine Zeile =
# eine Verknuepfung. Felder sind durch Whitespace getrennt, Pfade duerfen
# daher keine Leerzeichen enthalten.
#
#   <platform>  <kind>  <source>  <target>
#
# platform : unix | windows | all
# kind     : link (Datei)  |  dir (Verzeichnis)
# source   : Pfad relativ zur Repo-Wurzel
# target   : Zielpfad; Tokens werden vom jeweiligen Installer expandiert
#
# Tokens unix    : $HOME, $XDG_CONFIG  (= ${XDG_CONFIG_HOME:-$HOME/.config})
# Tokens windows : $HOME (USERPROFILE), $APPDATA, $PS5, $PS7
#                  $PS5/$PS7 = Dokumente\WindowsPowerShell bzw. Dokumente\PowerShell
#
# Kommentare (#) und Leerzeilen werden ignoriert.

# --- Shells ---------------------------------------------------------------
unix     link  shells/zsh/.zshrc                              $HOME/.zshrc
unix     link  shells/bash/.bashrc                            $HOME/.bashrc
unix     link  shells/bash/.bash_aliases                      $HOME/.bash_aliases

windows  link  shells/pwsh/Microsoft.PowerShell_profile.ps1   $PS5/Microsoft.PowerShell_profile.ps1
windows  dir   shells/pwsh/Modules/MyCliHelpers               $PS5/Modules/MyCliHelpers
windows  link  shells/pwsh/Modules/Update-WindowsApps.psm1    $PS5/Modules/Update-WindowsApps.psm1
windows  link  shells/pwsh/Microsoft.PowerShell_profile.ps1   $PS7/Microsoft.PowerShell_profile.ps1
windows  dir   shells/pwsh/Modules/MyCliHelpers               $PS7/Modules/MyCliHelpers
windows  link  shells/pwsh/Modules/Update-WindowsApps.psm1    $PS7/Modules/Update-WindowsApps.psm1

# --- Prompt (von zsh UND pwsh geteilt) ------------------------------------
unix     link  prompt/starship.toml                           $XDG_CONFIG/starship.toml
windows  link  prompt/starship.toml                           $HOME/.config/starship.toml

# --- Terminals ------------------------------------------------------------
# wezterm laedt ueber einen kleinen Entry-Loader, der die Repo-Config findet.
unix     link  install/wezterm-entry.lua                      $XDG_CONFIG/wezterm/wezterm.lua
windows  link  install/wezterm-entry.lua                      $HOME/.config/wezterm/wezterm.lua

unix     link  terminals/kitty/kitty.conf                     $XDG_CONFIG/kitty/kitty.conf
unix     link  terminals/tmux/tmux.conf                       $HOME/.tmux.conf

# --- CLI-Tools ------------------------------------------------------------
unix     link  cli/lazygit/config.yml                         $XDG_CONFIG/lazygit/config.yml
unix     link  cli/glow/glow.yml                              $XDG_CONFIG/glow/glow.yml
windows  link  cli/lazygit/config.yml                         $APPDATA/lazygit/config.yml
windows  link  cli/glow/glow.yml                              $APPDATA/glow/glow.yml
