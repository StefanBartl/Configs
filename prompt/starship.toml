# -----------------------------
# Timeouts
# -----------------------------
# Von zsh (Linux/WSL) UND pwsh (Windows) geladen. Die Defaults sind auf
# Linux-Verhaeltnisse geeicht und unter Windows zu knapp: git.exe muss dort
# durch den Virenscanner, in Corporate-Setups zusaetzlich durch Filter-Treiber.
# Reisst der Timeout, verschwindet das git-Segment kommentarlos aus dem Prompt.
command_timeout = 2000

# Wie lange starship das aktuelle Verzeichnis nach Projektdateien absuchen darf.
# Default sind 30 ms — in grossen Repos (WKDBooks, Notes) reicht das nicht.
# Bewusst NICHT auf die urspruenglich notierten 30000 gesetzt: das waere eine
# Obergrenze von 30 Sekunden, in der der Prompt bei einem haengenden Dateisystem
# (Netzlaufwerk, schlafende Platte) blockiert. 1000 ms loesen das eigentliche
# Problem und begrenzen den schlimmsten Fall auf eine Sekunde.
scan_timeout = 1000

# -----------------------------
# Prompt Layout
# -----------------------------
format = """
${env_var.WSL_DISTRO_NAME}$container$directory $git_branch $git_status
$character"""

# -----------------------------
# Runtime indicator (sync with WezTerm)
# -----------------------------
# Frueher ein [custom.runtime], das per sh-Skript /.dockerenv und
# /run/.containerenv prueft. Das hatte drei Fehler:
#
#   1. Es startete bei JEDEM Prompt einen Subprozess. Unter Windows gibt es
#      kein sh, das starship einfach aufrufen kann — der Aufruf lief in den
#      command_timeout und warf bei jedem Prompt eine Warnung.
#   2. Im Layout stand `$custom.runtime`. Ohne geschweifte Klammern ist das
#      kein Modulverweis: starship rendert `$custom` und haengt `.runtime` als
#      Literal an. Im Prompt stand woertlich ".runtime".
#   3. Ohne .gitattributes wurde die Datei unter Windows mit CRLF ausgecheckt,
#      womit jede Zeile des sh-Skripts auf einem \r endete.
#
# Beides kann starship nativ, ohne Subprozess und damit ohne Timeout:
#   [container]                erkennt Docker, Podman, systemd-nspawn, OCI
#   [env_var.WSL_DISTRO_NAME]  ist genau dann gesetzt, wenn es WSL ist
#
# In einem Container innerhalb von WSL erscheinen beide — das ist die
# ehrlichere Anzeige als das frueher exklusive if/elif/else.

[container]
format = '[\[$name\]]($style) '
style = "bold cyan"

[env_var.WSL_DISTRO_NAME]
format = '[\[WSL\]]($style) '
style = "bold cyan"

# -----------------------------
# Directory
# -----------------------------
[directory]
style = "bold yellow"
truncate_to_repo = true
truncation_length = 3

# -----------------------------
# Git
# -----------------------------
[git_branch]
symbol = ""
style = "bold purple"

[git_status]
style = "red"
# Submodule-Status ueberspringen: bei Repos mit Submodulen (Configs -> my-zsh,
# my-zsh -> plugins) kostet die Statusabfrage einen eigenen git-Durchlauf pro
# Submodul und war der haeufigste Grund fuer ein gerissenes command_timeout.
ignore_submodules = true

# -----------------------------
# Prompt symbol
# -----------------------------
[character]
success_symbol = ">"
error_symbol = ">"
